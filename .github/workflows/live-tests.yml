name: live-tests

# Live-network integration tests (CurseForge via api.curse.tools, Modrinth,
# GitHub, forgecdn). Kept off PR CI because they depend on third-party uptime.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Live tests
        run: npm run test:live
