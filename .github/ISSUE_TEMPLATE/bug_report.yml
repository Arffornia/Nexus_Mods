name: Bug report
description: Something does not work as expected
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Mod list entry (source + ids), library version, Node version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
